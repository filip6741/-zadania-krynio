<style>body{font-family:Arial,sans-serif;margin:18px}</style></head><body><textarea cols="90" rows="28" style="width:100%;max-width:1100px;height:560px">// Filip Ludka, numer w dzienniku 14\n// Zadanie 16\nvar A=parseInt(prompt(&quot;Podaj pierwszą liczbę A=&quot;,&quot;1&quot;));
var B=parseInt(prompt(&quot;Podaj drugą liczbę B=&quot;,&quot;2&quot;));

document.write(&quot;wczytane liczby: A=&quot;+A+&quot; B=&quot;+B+&quot;&lt;br&gt;&quot;);
document.write(&quot;(&quot;+A+&quot; + &quot;+B+&quot;)^3 = &quot;+A+&quot;^3 + 3*(&quot;+A+&quot;^2)*(&quot;+B+&quot;) + 3*(&quot;+A+&quot;)*(&quot;+B+&quot;^2) + &quot;+B+&quot;^3 = &quot;+Math.pow(A,3)+&quot; + &quot;+(3*A*A*B)+&quot; + &quot;+(3*A*B*B)+&quot; + &quot;+Math.pow(B,3)+&quot; = &quot;+wynik);</textarea></body></html>
