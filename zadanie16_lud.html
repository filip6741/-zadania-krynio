<!DOCTYPE html>
<html lang="pl-PL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ludka — Zadanie 16</title>
<style>body{font-family:Arial,sans-serif;margin:18px}</style></head><body><div style="color:navy;font-size:30px"><script>var A=parseInt(prompt("Podaj pierwszą liczbę A=","1"));
var B=parseInt(prompt("Podaj drugą liczbę B=","2"));
var wynik=Math.pow(A+B,3);
document.write("wczytane liczby: A="+A+" B="+B+"<br>");
document.write("("+A+" + "+B+")^3 = "+A+"^3 + 3*("+A+"^2)*("+B+") + 3*("+A+")*("+B+"^2) + "+B+"^3 = "+Math.pow(A,3)+" + "+(3*A*A*B)+" + "+(3*A*B*B)+" + "+Math.pow(B,3)+" = "+wynik);</script></div><button onclick="window.close()">zamknij okno</button></body></html>
